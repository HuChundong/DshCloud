# Patch layer for the build-time shell harvest.
#
# The sandbox composition minus its tunnel: the harvest has no gateway to dial
# and no sandbox identity to present, and the tunnel plugin fails loud without
# them. The tunnel contributes no client half, so leaving it out cannot change
# the boot manifest this harvest exists to capture.
#
# Everything that does contribute a client half has to be here. The harvest is
# what the web deployment serves to every tenant, so a plugin missing from this
# file is a plugin whose browser half no tenant ever loads — while its host half
# runs in every sandbox, answering calls the interface never makes.

# The file plane and the configuration page: what a browser needs when the
# backend it talks to is on another machine. Its host half is inert here — it
# registers a route nobody calls — and its client half is the point.
- insert:
    - id: sandbox-host
      name: dsh-sandbox-host

# The tenant's account: who is signed in, how to sign out, and the way in to the
# console. dsh has no notion of the gateway's sessions, so nothing in its own
# composition offers a way to end one.
#
# Installed into the profile's node_modules by the image build, because the
# client-module registry resolves a plugin's package.json from the config
# tree's baseUrl — the profile directory — and only scans packages it can
# resolve by name. A path-loaded entry mounts its host half and contributes no
# client half at all.
- insert:
    - id: tenant-account
      name: dsh-tenant-account

# The right-hand panel. It has no host half worth the name — its data plane is
# envd, which the gateway addresses from outside the sandbox — but the entry has
# to be here anyway: the client-module registry only scans packages the Loader
# mounted, so an unmounted name is a browser half no tenant ever loads.
- insert:
    - id: artifact-panel
      name: dsh-artifact-panel

# This deployment's own mark and name, in the three slots the shipped brand
# plugin fills. Written because the shipped one fills them with DeepSeek's
# whale and wordmark, which this deployment has no right to wear: its brand
# guidelines ask projects not to use the trademark as their own identity, and
# the package's own README points the other way — alternative presentation
# belongs in another package occupying the same slots.
- insert:
    - id: brand
      name: dsh-brand

# And the row it replaces. The plugin registers at a lower priority and would
# take the seat anyway, but a shipped brand that is still mounted is still
# fetching and still one HMR race away from being seen; the seat is only ever
# meant to have one occupant here.
- id: ui-brand-official
  disabled: true

# The client hot-reload channel. Its SSE endpoint, /plugins/events, is the one
# frontend path that is not a static artifact — the browser opens it and keeps
# it open, expecting a live host to push rebuild notices.
#
# This deployment serves every client bundle from the web deployment, harvested
# at build time, and nothing rebuilds them while a tenant is signed in. Leaving
# the row on advertises a channel that no longer has a rebuilder behind it, and
# routing it to a sandbox to satisfy the browser would put a frontend path back
# on a per-tenant component — the one thing the split exists to prevent.
- id: client-hmr
  disabled: true

# Stated here as well as in the sandbox patch, so the two compositions differ
# only by the tunnel. It does not change which client plugins compose, but a
# harvest that disagreed with the sandbox about anything would be a harvest
# nobody could reason about.
- id: api-gateway
  config:
    nativeOpen: false
