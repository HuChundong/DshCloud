# Patch layer for the sandbox composition.
#
# Applied over the web profile by the sandbox entrypoint. It exists to add what
# this deployment needs, strip what a shared multi-tenant deployment must not
# offer a tenant, and state one thing about this host that the harness would
# otherwise have to guess.
#
# It stays this short on purpose. Everything with behaviour lives in the three
# plugins below, each of which follows a different fact about this deployment —
# the tunnel follows the transport, `sandbox-host` follows the backend being on
# a machine the tenant cannot reach, and `tenant-account` follows there being
# tenants at all. What cannot live in a plugin is which plugins are mounted and
# what another entry is configured to be, which is what a patch layer is for.

# The tunnel that carries this sandbox's /api traffic to the gateway. It runs
# inside dsh rather than beside it: as a plugin, `inject` states when the
# surface it forwards to exists, where a separate process could only probe for
# it — and dialled too early twice before that probe was right.
#
# Named rather than loaded by path, like every other entry here. A path-loaded
# plugin mounts its host half and contributes no client half, because the
# client-module registry resolves a plugin's package.json from the config tree's
# baseUrl and scans only what it can resolve by name. This one contributes no
# client half either way, but naming it keeps one rule for all three of ours.
#
# `insert` rather than a bare entry: a patch layer targets existing ids, so a
# new plugin has to be inserted explicitly.
- insert:
    - id: gateway-tunnel
      name: dsh-gateway-tunnel

# What dsh needs in order to be usable from a browser that is not on the same
# machine as its backend: the file plane a tenant uploads through, and the
# configuration document read back instead of handed to a desktop that is not
# there.
#
# It registers its own `/files` RPC channel rather than adding endpoints to
# `/api`, because `/api` accepts exactly one interceptor and dsh's own
# `typert-gateway` holds it. `web/site.inc` and the gateway route that channel
# the same way they route `/api`.
- insert:
    - id: sandbox-host
      name: dsh-sandbox-host

# The tenant's account: who is signed in, how to sign out, the way in to the
# console for whoever administers this deployment, and the onboarding steps a
# deployment with its own sign-in page has already said.
#
# Installed into the profile's node_modules by the image build, because the
# client-module registry resolves a plugin's package.json from the config
# tree's baseUrl — the profile directory — and only scans packages it can
# resolve by name. A path-loaded entry mounts its host half and contributes no
# client half at all.
- insert:
    - id: tenant-account
      name: dsh-tenant-account

# The right-hand panel. It has no host half worth the name — its data plane is
# envd, which the gateway addresses from outside the sandbox — but the entry has
# to be here anyway: the client-module registry only scans packages the Loader
# mounted, so an unmounted name is a browser half no tenant ever loads.
- insert:
    - id: artifact-panel
      name: dsh-artifact-panel

# Which provider the models actually come from.
#
# The harness composes two LLM adapters and mounts the multi-provider one
# DORMANT: `llm-pi-ai` registers no routes at all until something supplies
# provider profiles, and the shipped default therefore falls through to
# `llm-deepseek`, which speaks DeepSeek's own wire protocol. That is the wrong
# protocol for this deployment's endpoint, and the symptom was not a connection
# error but a stream whose tool calls arrived without ids or names — the agent
# answering `unknown tool ""` to a tool it had just been told about.
#
# So the profile is supplied here. `opencode-go` is a route pi-ai already
# carries a catalog for, which is why this says almost nothing: naming it takes
# the endpoint, the wire protocol and all sixteen models with it. Enumerating
# them — as the Models page does when a tenant configures this by hand — would
# be a copy of that catalog to keep in step with it.
#
# A tenant's own settings document still wins. This is the default a sandbox
# starts with, not a ceiling: the Models page writes `llm-pi-ai:` into
# `$DSH_HOME/settings.yaml`, which is on their volume and overrides this
# without a restart.
- id: llm-pi-ai
  config:
    # The route is NAMED, not inferred. `MODEL_PROVIDER` says which pi-ai route
    # serves this deployment; naming one is the whole configuration, because a
    # catalog route already carries its endpoint, its wire protocol, and every
    # model on it with the reasoning levels and dispatch format each one wants.
    #
    # It is named rather than derived from `DEEPSEEK_BASE_URL` because that
    # variable answers a different question. It is the egress anchor — the host
    # `egress.js` scopes the credential-injection rule to — and its DeepSeek
    # name is historical: the endpoint behind it is not DeepSeek's own, so
    # treating "there is a base URL" as "this is the DeepSeek adapter's route"
    # is exactly the assumption that sent requests in the wrong protocol and
    # got tool calls back with no id or name.
    #
    # Unset means no catalog covers this endpoint, so it is described by hand
    # at whatever `DEEPSEEK_BASE_URL` points at — the development proxy's case.
    providers: !!js >-
      process.env.MODEL_PROVIDER
        ? { [process.env.MODEL_PROVIDER]: { apiKeyEnv: 'DEEPSEEK_API_KEY' } }
        : { 'dev-proxy': {
              api: 'openai-completions',
              displayName: '内网代理',
              baseURL: process.env.DEEPSEEK_BASE_URL,
              apiKeyEnv: 'DEEPSEEK_API_KEY',
              models: [{
                id: 'deepseek-v4-flash',
                name: 'DeepSeek V4 Flash',
                contextWindow: 393216,
                maxTokens: 384000,
                reasoningEfforts: { high: 'high', max: 'max' },
                compat: { thinkingFormat: 'deepseek' }
              }]
            } }
    #
    # `apiKeyEnv` is a reference, not the secret. In production the sandbox is
    # handed `injected-by-egress-policy` under that name and CubeEgress replaces
    # the Authorization header on the way out, so the real key never enters a
    # machine the tenant is root on.
    #
    # The last two fields on the hand-declared model are why the thinking-effort
    # control exists in development at all. A hand-declared model inherits
    # nothing from the installed catalog — "a hand-declared model has none and
    # does not reason" — so the route came up with `reasoning: false` and the
    # composer, correctly, offered no effort to choose. A named route says none
    # of this because it inherits all of it.
    #
    # The values are the catalog's own for this model, not a guess: it offers
    # `high` and `max` only, and dispatches them in DeepSeek's format rather
    # than OpenAI's `reasoning_effort`. Declaring a level the endpoint does not
    # answer to would put a control on screen that quietly does nothing.

# The model a new session starts on, named for whichever route is configured
# above. `deepseek-v4-flash` exists on both, so the model this deployment
# defaults to does not change between development and production — only where
# the request goes.
- id: agent-default-model
  config:
    provider: !!js "process.env.MODEL_PROVIDER || 'dev-proxy'"
    model: deepseek-v4-flash
    # Stated, because leaving it out is not "the model's own default" — the
    # setting simply goes missing, and a session starts at whatever the route
    # falls back to. The picker still moves it per session; this is only where
    # a new one begins.
    reasoningEffort: max

# The client hot-reload channel. Its SSE endpoint, /plugins/events, is the one
# frontend path that is not a static artifact — the browser opens it and keeps
# it open, expecting a live host to push rebuild notices.
#
# This deployment serves every client bundle from the web deployment, harvested
# at build time, and nothing rebuilds them while a tenant is signed in. Leaving
# the row on advertises a channel that no longer has a rebuilder behind it, and
# routing it to a sandbox to satisfy the browser would put a frontend path back
# on a per-tenant component — the one thing the split exists to prevent.
- id: client-hmr
  disabled: true

# What this host can and cannot hand to a desktop, stated rather than detected.
#
# `canOpenPath` decides whether the harness offers gestures that end at a
# native opener — the agent-preset roster's "open location", the deliverables
# row's "show in folder". Left unset, dsh asks the platform, and on this image
# the answer is already the right one: Linux with no DISPLAY and no
# WAYLAND_DISPLAY cannot open anything.
#
# It is set anyway, because that correct answer is a coincidence of the base
# image. Anything that later put a display server, an Xvfb, or a stray DISPLAY
# into this container would flip the harness back to offering a person controls
# that open windows nobody is looking at.
- id: api-gateway
  config:
    nativeOpen: false
