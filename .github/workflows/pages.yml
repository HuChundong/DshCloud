name: Pages

# The project page, from the same source the web image serves at `/`, built the
# same way: `vite build` in `web/landing`. One build definition and three
# consumers — this workflow, the Dockerfile's `landing` stage, and `npm run dev`
# for whoever is editing the page — so what is published cannot be assembled
# differently from what is deployed.

on:
  push:
    branches: [main]
    # Only what the site is made of. A push that touches neither leaves the
    # published page exactly as it was, so republishing it says nothing.
    paths:
      - 'web/landing/**'
      - 'gateway/assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and the newest wins. `cancel-in-progress: false`
# unlike CI: a half-finished deployment is a published page, and cancelling one
# leaves the site in whatever state it reached.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The same gate CI runs. It is repeated here rather than assumed, because
      # this workflow can be dispatched by hand against a tree CI never saw.
      - name: Landing page
        run: node scripts/check-landing.mjs

      - name: Build
        # `npm ci` rather than `npm install`, so the published page is built
        # against the versions the lockfile names and not whatever resolved
        # today.
        run: |
          npm ci --no-audit --no-fund --prefix web/landing
          npm run build --prefix web/landing
          mv web/landing/dist _site
          # Pages runs Jekyll over an artifact unless told not to, and Jekyll
          # drops files and directories whose names begin with an underscore.
          # Nothing here starts with one today; this keeps that from becoming a
          # thing anyone has to remember.
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
