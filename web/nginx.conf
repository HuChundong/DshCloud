# The user-facing entry. Static bytes are answered here from disk; only the
# session-bearing surface is proxied to the gateway.
#
# This is the layering the deployment wants: the frontend is the front door and
# the gateway is a backend for `/api`. Putting the gateway in front instead made
# every asset — index.html and 44 client bundles on a cold load — cross a Node
# process for no reason: measured at ~26% more latency per static request when
# nothing else competed for the event loop.

upstream gateway {
  server gateway:8080;
  # Connections held open between requests. Every /api call, every panel route
  # and every auth_request subrequest goes upstream — and a cold page load makes
  # dozens — so without this each one pays a TCP handshake to reach a process on
  # the same network.
  keepalive 32;
}

# `Connection: upgrade` only for requests that actually carry an Upgrade header.
#
# The empty case is an EMPTY VALUE, not `close`. nginx's own WebSocket example
# says `close`, and pairing that with the keepalive above cancels it: every
# ordinary proxied request would ask the gateway to hang up the connection this
# is trying to reuse. Empty means nginx sends no Connection header at all, which
# with HTTP/1.1 is the persistent default.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}

# Compression, which nothing was doing.
#
# The front door is 71 KB of markup that gzips to 22, and upstream's build ships
# a megabyte of JavaScript across two files. Both were served whole to every
# visitor.
#
# What is NOT listed matters as much as what is: images, fonts and archives are
# already compressed, and running them through gzip spends CPU to make them very
# slightly larger.
gzip on;
gzip_vary on;
gzip_comp_level 5;
# Below about a KB the header costs more than the saving, and a small response
# usually fits in the first round trip either way.
gzip_min_length 1024;
gzip_proxied any;
gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/json
  application/manifest+json
  application/wasm
  image/svg+xml;

# The version number is not the visitor's business, and naming it only helps
# someone matching a deployment against a vulnerability list.
server_tokens off;

# Plain HTTP. It serves the same site as the TLS port, except where the
# deployment has been told its public HTTPS port — then this redirects there
# instead. `entrypoint.sh` writes that decision into the include below, and
# writes the file empty when there is nothing to redirect to, which is why this
# is a generated include rather than a `return` written here: nginx cannot work
# the address out for itself, since it sees the port it listens on and not the
# one the container publishes. Same reason `absolute_redirect` is off.
#
# The include sits before the site, but position is not what makes it win: a
# server-level `return` runs in the rewrite phase, before nginx has even chosen
# a location. When the file is empty, nothing happens and the site is served.
server {
  listen 80;
  server_name _;
  include /etc/nginx/redirect.inc;
  include /etc/nginx/site.inc;
}

# TLS exists because the application requires a secure context, not because
# anything here is confidential in transit. `crypto.randomUUID` — which the
# connection, runtime and conversation client plugins all call — is undefined
# on a page served over plain HTTP to anything but localhost, so the frontend
# fails on load when reached at a LAN address without this.
#
# The certificate is generated per deployment on first start; see
# `entrypoint.sh`. `compose.tls.yml` replaces it with one a browser trusts.
#
# `server_name _` on purpose, and not the domain: this deployment answers on
# whatever address reaches it — a domain, a LAN address, localhost — and one
# site serves all of them. Naming a host here would only matter if a second
# site had to be told apart from this one, and there is no second site.
server {
  listen 443 ssl;
  http2 on;
  server_name _;
  ssl_certificate /etc/nginx/tls/server.crt;
  ssl_certificate_key /etc/nginx/tls/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  include /etc/nginx/site.inc;
}
